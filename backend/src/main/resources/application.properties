# Server
server.port=8080
server.servlet.context-path=/api

# Database — đọc từ env variable khi deploy
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/peatea_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# JWT — đọc từ env variable khi deploy
app.jwt.secret=${JWT_SECRET:peatea_super_secret_jwt_key_2026_dev_mode_token_secure_string_xyz}
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# Admin credentials — đọc từ env variable khi deploy
app.admin.email=${ADMIN_EMAIL:admin@squishyheaven.ph}
app.admin.password=${ADMIN_PASSWORD:PeateaAdmin@2026}

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
app.upload.dir=./uploads

# CORS — đổi thành domain thật khi deploy
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173,https://raffle-growl-trash.ngrok-free.dev}

# Cloudinary — set env variables khi deploy
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:your_cloud_name}
cloudinary.api-key=${CLOUDINARY_API_KEY:your_api_key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:your_api_secret}
cloudinary.folder=${CLOUDINARY_FOLDER:peatea_squishy}


logging.level.com.cuteshop=INFO
logging.level.org.springframework.security=WARN